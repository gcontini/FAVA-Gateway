[project]
name = "fava"
version = "0.1.0"
description = "FAVA: pass-through LLM API reverse proxy (authorization seam placeholder)"
requires-python = ">=3.10"
dependencies = [
    # The upstream leg. Plain httpx: nothing MCP-specific remains.
    "httpx>=0.28",
    "starlette>=1.6",
    "uvicorn>=0.52",
    "anyio>=4.15",
    "openai>=1.60",
]

[project.scripts]
# `uv run fava-llm-proxy --upstream-url https://api.openai.com/v1`
fava-llm-proxy = "main:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The distribution `fava` ships two packages from src/: `llm_proxy` is the
# transport, `fava` is everything that reasons about what it relayed. The
# dependency arrow only ever points `fava` -> `llm_proxy`. `main.py` is the
# top-level entrypoint that wires the two together.
packages = ["src/llm_proxy", "src/fava"]

[tool.hatch.build.targets.wheel.force-include]
"src/main.py" = "main.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.format]
indent-style = "space"