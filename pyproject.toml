[project]
name = "fava"
version = "0.1.0"
description = "FAVA: pass-through LLM API reverse proxy (authorization seam placeholder)"
requires-python = ">=3.10"
dependencies = [
    # The upstream leg. Plain httpx: nothing MCP-specific remains, and the
    # OpenAI SDK used in the tests depends on httpx too, so the venv holds one
    # HTTP stack rather than two.
    "httpx>=0.28",
    "starlette>=1.6",
    "uvicorn>=0.52",
    "anyio>=4.15",
]

[project.scripts]
# `uv run fava-llm-proxy --upstream-url https://api.openai.com/v1`
fava-llm-proxy = "llm_proxy.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    # Drives the end-to-end tests: a real client pointed at the proxy's base
    # URL is the deployment contract, so the tests exercise it directly.
    "openai>=1.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The distribution `fava` ships the `llm_proxy` package from src/.
packages = ["src/llm_proxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
